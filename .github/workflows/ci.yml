name: CI

# Validation only: static checks, Dart/Flutter tests, and a debug APK that proves the
# Kotlin/Dart side compiles and packages. The bundled runtime is NOT built here — the ten
# runtime tests that import a built dsh tree, and a real release APK, belong to the Runtime
# build workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: generated UI text is in sync
        run: python3 app/tool/l10n_merge.py --check
      - name: user guide is in sync (zh/en + skill copies)
        run: python3 app/tool/guide_sync.py --check
      - name: runtime tests that need no built dsh prefix
        run: |
          # Tests that import a built dsh tree need DSH_PREFIX / DSH_TEST_PREFIX
          # (runtime/build-runtime.sh output); those run in the Runtime build workflow.
          files=$(grep -L -e "DSH_PREFIX" -e "@deepseek-ai/" runtime/tests/*.test.mjs || true)
          if [ -z "$files" ]; then
            echo "no prefix-free runtime tests found" >&2
            exit 1
          fi
          node --test $files
      - name: plugin kit tests
        working-directory: sdk/plugin-kit
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test

  dart:
    name: dart packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: dsh_client
        working-directory: packages/dsh_client
        run: |
          dart pub get
          dart analyze
          dart test
      - name: dsh_remote
        working-directory: packages/dsh_remote
        run: |
          dart pub get
          dart analyze
          dart test

  app:
    name: app analyze, APK and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
      # Before the widget tests: a compile failure here is the signal we care about most,
      # and it must not be masked by a later step failing. The project builds through its own
      # script because the app uses product flavors (arm64/x64) — plain `flutter build apk`
      # leaves the APK under a flavor-suffixed name that Flutter's own lookup misses.
      - name: debug APK (compiles Kotlin; no bundled runtime)
        run: tooling/build-apk.sh --debug -f arm64
      - name: CJK fonts for widget tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
          sudo mkdir -p /usr/share/fonts/noto-cjk
          for f in NotoSansCJK-Regular.ttc NotoSansCJK-Bold.ttc NotoSansCJK-Light.ttc; do
            src=$(find /usr/share/fonts -name "$f" -print -quit)
            if [ -n "$src" ]; then
              sudo ln -sf "$src" "/usr/share/fonts/noto-cjk/$f"
            else
              echo "::warning::test font not provided by the packages: $f"
            fi
          done
          ls -l /usr/share/fonts/noto-cjk/
      - name: widget tests (goldens excluded)
        working-directory: app
        run: |
          # Goldens compare pixels against images taken on a developer machine; the CI font
          # rasterisation differs by 0.04–1.4%, so they fail here without saying anything about
          # the code. Everything else runs.
          mapfile -t files < <(find test -name '*_test.dart' ! -name '*_golden_test.dart' | sort)
          echo "running ${#files[@]} test files, goldens excluded"
          flutter test "${files[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-go-debug-apk
          path: app/build/app/outputs/**/*.apk
          if-no-files-found: warn
