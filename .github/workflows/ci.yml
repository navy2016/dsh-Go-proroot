name: CI

# Validation only: static checks, Dart/Flutter tests, and a debug APK that proves the
# Kotlin/Dart side compiles and packages. The bundled runtime is NOT built here (it needs
# several hundred MB of downloads) — that is the Runtime build workflow, which also produces
# a release APK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: generated UI text is in sync
        run: python3 app/tool/l10n_merge.py --check
      - name: user guide is in sync (zh/en + skill copies)
        run: python3 app/tool/guide_sync.py --check
      - name: runtime bridge and patch tests
        run: node --test runtime/tests/*.test.mjs
      - name: plugin kit tests
        working-directory: sdk/plugin-kit
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test

  dart:
    name: dart packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: dsh_client
        working-directory: packages/dsh_client
        run: |
          dart pub get
          dart analyze
          dart test
      - name: dsh_remote
        working-directory: packages/dsh_remote
        run: |
          dart pub get
          dart analyze
          dart test

  app:
    name: app tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
      - name: widget tests
        working-directory: app
        run: flutter test
      - name: debug APK (compiles Kotlin, no bundled runtime)
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-debug-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
