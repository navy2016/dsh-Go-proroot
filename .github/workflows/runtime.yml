name: Runtime build

# Builds the bundled Linux runtime (Ubuntu base + Node + DSH + proroot) and, optionally, a
# release APK from it. Heavy and slow: the runtime downloads several hundred MB and packs a
# rootfs. Run it by hand — a normal push only runs CI.
on:
  workflow_dispatch:
    inputs:
      abi:
        description: ABI to build
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - x86_64
      apk:
        description: Also build a release APK
        type: boolean
        default: true

concurrency:
  group: runtime-${{ inputs.abi }}
  cancel-in-progress: true

jobs:
  build:
    name: runtime ${{ inputs.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        run: |
          # Keep /usr/local/lib/android: the APK step needs the runner's Android SDK.
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null || true
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Without this each run gets a fresh ~/.android/debug.keystore, so every APK would carry a
      # different signing key and every install would need the previous one uninstalled first.
      - name: keep one debug signing key across runs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: build runtime
        run: runtime/build-runtime.sh ${{ inputs.abi }}
      - name: runtime tests against the built tree
        if: inputs.abi == 'x86_64'
        run: |
          # Only on a matching architecture: the built dsh tree carries platform native
          # bindings (node-addon-require-builtin), so an arm64 tree cannot load on this x86_64
          # runner. The tests CI skips reach an installed dsh tree through these variables.
          prefix="runtime/.work/${{ inputs.abi }}/dsh-prefix"
          if [ -d "$prefix" ]; then
            DSH_PREFIX="$prefix" DSH_TEST_PREFIX="$prefix" node --test --test-isolation=none runtime/tests/fs-create-exclusive.test.mjs
            files=$(find runtime/tests -maxdepth 1 -name '*.test.mjs' ! -name 'fs-create-exclusive.test.mjs' | sort)
            DSH_PREFIX="$prefix" DSH_TEST_PREFIX="$prefix" node --test $files
          else
            echo "no $prefix; nothing to test against" >&2
            exit 1
          fi
      - name: runtime tests skipped for arm64
        if: inputs.abi != 'x86_64'
        run: echo "An arm64 dsh tree cannot be exercised on the x86_64 runner (native bindings); build x86_64 to run the runtime tests."
      - name: build release APK
        if: inputs.apk
        run: |
          if [ "${{ inputs.abi }}" = "x86_64" ]; then flavor=x64; else flavor=arm64; fi
          tooling/build-apk.sh --build-name 0.0.0-ci -f "$flavor"
      - name: verify proroot packaging
        env:
          ABI: ${{ inputs.abi }}
          EXPECT_APK: ${{ inputs.apk }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import zipfile

          abi = os.environ['ABI']
          jni = pathlib.Path('runtime/out') / abi / 'jniLibs' / abi
          if not jni.is_dir():
              raise SystemExit(f'{abi}: native library staging directory is missing')
          vendor = {
              'libproroot.so', 'libproroot-runtime.so', 'libproroot-linker.so',
              'libproroot-stub-loader.so', 'libproroot-bridge.so',
          }
          shims = {'libdsha-proroot-compat.so', 'libdsha-proroot-linker.so'}
          expected = {}
          if abi == 'arm64-v8a':
              pins = dict(re.findall(r'^\s*\[(libproroot[^\]]*\.so)\]=([0-9a-f]{64})$',
                                    pathlib.Path('runtime/build-runtime.sh').read_text(), re.MULTILINE))
              if set(pins) != vendor:
                  raise SystemExit('proroot vendor pins are missing or unexpected')
              expected.update(pins)
              for name in shims:
                  source = pathlib.Path('runtime/vendor/proroot-compat/arm64-v8a') / name
                  expected[name] = hashlib.sha256(source.read_bytes()).hexdigest()
          staged = {path.name for path in jni.glob('*proroot*.so')}
          if staged != set(expected):
              raise SystemExit(f'{abi}: unexpected staged proroot files: {sorted(staged)}')
          for name, digest in sorted(expected.items()):
              if hashlib.sha256((jni / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'{abi}: staged {name} differs from its source')
          print(f'{abi}: staged proroot files verified ({len(expected)})')

          if os.environ['EXPECT_APK'] == 'true':
              apks = sorted(pathlib.Path('app/build/app/outputs/flutter-apk').glob('*.apk'))
              if not apks:
                  raise SystemExit('no APK found to verify')
              for apk in apks:
                  with zipfile.ZipFile(apk) as archive:
                      actual = [name for name in archive.namelist()
                                if name.startswith('lib/') and 'proroot' in name and name.endswith('.so')]
                      wanted = {f'lib/{abi}/{name}' for name in expected}
                      if set(actual) != wanted or len(actual) != len(wanted):
                          raise SystemExit(f'{apk.name}: missing, duplicate or unexpected proroot entries')
                      for name, digest in sorted(expected.items()):
                          if hashlib.sha256(archive.read(f'lib/{abi}/{name}')).hexdigest() != digest:
                              raise SystemExit(f'{apk.name}: {name} was modified during APK packaging')
                          print(f'{apk.name}: {name} SHA256 OK')
                  print(f'{apk.name}: proroot payload verified ({len(expected)} files)')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-runtime-${{ inputs.abi }}
          path: |
            runtime/out/${{ inputs.abi }}/assets/runtime/manifest.json
            runtime/out/${{ inputs.abi }}/build-report.json
            app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn